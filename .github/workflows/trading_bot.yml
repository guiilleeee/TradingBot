name: Trading Bot Cron

on:
  schedule:
    # Run every 4 hours. Note: GitHub Actions cron can lag a few minutes under load.
    # This is acceptable for a 4h interval, not suitable for sub-minute HFT.
    - cron: '0 */4 * * *'
  workflow_dispatch: # allow manual triggering

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the updated DB and CSV back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trading Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          python -m src.main

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Prepare GitHub Pages folder
          mkdir -p docs
          cp dashboard.html docs/index.html
          cp signals.csv docs/signals.csv
          cp dashboard_config.json docs/dashboard_config.json || true
          
          git add trading_bot.db signals.csv docs/index.html docs/signals.csv docs/dashboard_config.json
          # Only commit if there are changes
          git commit -m "chore: Update trading bot logs and dashboard [skip ci]" || echo "No changes to commit"
          git push
